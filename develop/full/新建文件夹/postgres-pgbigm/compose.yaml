services:
  full_postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/postgres-pgbigm:18.6
    container_name: full_postgres_pgbigm_test
    platform: linux/amd64
    ports:
      - "14121:5432"
    environment:
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_pgbigm_test_data:/var/lib/postgresql
    restart: always
    networks:
      - full_net
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_bigm

volumes:
  postgres_pgbigm_test_data:

networks:
  full_net:
    external: true
